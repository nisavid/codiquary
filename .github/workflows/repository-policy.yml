name: Repository policy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: repository-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install workflow-policy parser
        run: |
          python3 -m venv "$RUNNER_TEMP/policy-venv"
          "$RUNNER_TEMP/policy-venv/bin/python" -m pip install -r scripts/requirements-policy.txt
          printf '%s\n' "$RUNNER_TEMP/policy-venv/bin" >> "$GITHUB_PATH"

      - name: Test workflow reference validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate repository policy
        run: ./scripts/check-repository.sh
